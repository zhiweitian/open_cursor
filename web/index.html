<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenCursor</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header>
    <b>OpenCursor</b>
    <nav><a href="/">聊天</a><a href="/editor?path=plan.md">编辑器</a><a href="/config">模型配置</a></nav>
    <span class="meta" id="badge"></span>
  </header>
  <div class="layout">
    <aside id="tree"></aside>
    <main>
      <div id="thread"></div>
      <div id="session"></div>
      <div id="todos"></div>
      <div id="automations"></div>
      <div id="patches"></div>
      <div class="opts">
        <label><input id="review" type="checkbox" checked /> 写入需审核（diff）</label>
        <label><input id="danger" type="checkbox" /> 允许危险 shell</label>
        <label><input id="useMcp" type="checkbox" checked /> 连接 MCP</label>
        <button class="ghost" id="restore" disabled>Checkpoint</button>
      </div>
      <div id="composer">
        <textarea id="q" placeholder="提问… 可用 @src/agent.ts 附带文件上下文"></textarea>
        <button id="go">发送</button>
      </div>
      <p id="log"></p>
    </main>
    <aside id="canvas" hidden></aside>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const thread = $("thread");
    const patchesEl = $("patches");
    let runId = null;
    let checkpointAt = "after";

    fetch("/api/config").then((r) => r.json()).then((c) => {
      $("badge").textContent = c.hasKey
        ? `${c.model}`
        : "无 Key：可设 OPENCURSOR_MOCK_LLM=fast 后重启";
    });

    function renderTree(nodes, depth = 0) {
      const ul = document.createElement("ul");
      for (const n of nodes) {
        const li = document.createElement("li");
        li.style.paddingLeft = depth * 10 + "px";
        li.textContent = (n.type === "dir" ? "📁 " : "📄 ") + n.name;
        li.onclick = (ev) => {
          if (n.type !== "file") return;
          if (ev.metaKey || ev.ctrlKey) {
            location.href = `/editor?path=${encodeURIComponent(n.path)}`;
            return;
          }
          const q = $("q");
          q.value = (q.value.trim() ? q.value.trim() + " " : "") + `@${n.path} `;
          q.focus();
        };
        ul.appendChild(li);
        if (n.children?.length) ul.appendChild(renderTree(n.children, depth + 1));
      }
      return ul;
    }
    fetch("/api/tree").then((r) => r.json()).then(({ tree }) => {
      $("tree").appendChild(renderTree(tree));
    });

    function add(who, text, steps) {
      const el = document.createElement("div");
      el.className = "msg " + who;
      el.innerHTML = `<div class="who">${who}</div>`;
      if (steps) steps.forEach((s) => {
        const p = document.createElement("pre");
        p.className = "step";
        p.textContent = `${s.tool} ${JSON.stringify(s.args)}\n${s.out.slice(0, 800)}`;
        el.appendChild(p);
      });
      const t = document.createElement("div");
      t.textContent = text;
      el.appendChild(t);
      thread.appendChild(el);
      thread.scrollTop = thread.scrollHeight;
    }

    async function refreshSession() {
      const s = await (await fetch("/api/session")).json();
      const el = $("session");
      el.innerHTML = "";
      if (s.goal && s.goal.title) {
        const g = document.createElement("p");
        g.id = "goal";
        g.textContent = `目标：${s.goal.title}（${s.goal.status}）`;
        el.appendChild(g);
      }
      if (s.openFile) {
        const open = document.createElement("p");
        open.id = "open-file";
        open.textContent = `正在编辑：${s.openFile}`;
        el.appendChild(open);
      }
      if (s.selection && s.selection.path) {
        const line = document.createElement("p");
        line.id = "selection";
        line.textContent = `选区：${s.selection.path}:${s.selection.startLine}-${s.selection.endLine}`;
        const clear = document.createElement("button");
        clear.className = "ghost";
        clear.textContent = "清除选区";
        clear.onclick = async () => {
          await fetch("/api/selection", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ clear: true }),
          });
          refreshSession();
        };
        el.appendChild(line);
        el.appendChild(clear);
      }
      refreshTodos();
      refreshAutomations();
      if (!s.question) return;
      const p = document.createElement("p");
      p.textContent = s.question.prompt;
      el.appendChild(p);
      for (const o of s.question.options || []) {
        const b = document.createElement("button");
        b.className = "ghost";
        b.textContent = o.label;
        b.onclick = async () => {
          await fetch("/api/session/answer", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ optionId: o.id }),
          });
          refreshSession();
        };
        el.appendChild(b);
      }
    }

    async function refreshTodos() {
      const box = $("todos");
      const data = await (await fetch("/api/todos")).json();
      box.innerHTML = "";
      for (const item of data.todos || []) {
        const row = document.createElement("p");
        row.textContent = `${item.status} ${item.id}: ${item.content}`;
        if (item.status === "pending" || item.status === "in_progress") {
          const button = document.createElement("button");
          button.className = "ghost";
          button.textContent = "完成";
          button.onclick = async () => {
            await fetch("/api/todos/status", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ id: item.id, status: "completed" }),
            });
            refreshTodos();
          };
          row.appendChild(document.createTextNode(" "));
          row.appendChild(button);
        }
        box.appendChild(row);
      }
    }

    async function refreshAutomations() {
      const box = $("automations");
      const data = await (await fetch("/api/automations")).json();
      box.innerHTML = "";
      const items = data.automations || [];
      if (!items.length) return;
      const line = document.createElement("p");
      line.id = "automation-list";
      line.textContent = items.map((item) => `${item.id}: ${item.prompt}`).join("；");
      const button = document.createElement("button");
      button.className = "ghost";
      button.textContent = "检查到期";
      const run = document.createElement("button");
      run.className = "ghost";
      run.textContent = "跑到期的";
      const due = document.createElement("p");
      due.id = "automation-due";
      button.onclick = async () => {
        const r = await fetch("/api/automations/tick", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: "{}",
        });
        const j = await r.json();
        due.textContent = j.due?.length ? `到期：${j.due.map((item) => item.prompt).join("；")}` : "没有到期";
      };
      run.onclick = async () => {
        const r = await fetch("/api/automations/run", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: "{}",
        });
        const j = await r.json();
        due.textContent = j.runs?.length
          ? j.runs.map((item) => `${item.prompt} → ${item.text}`).join("；")
          : "没有到期的自动化";
      };
      box.appendChild(line);
      box.appendChild(button);
      box.appendChild(run);
      box.appendChild(due);
    }

    function renderPatches(patches) {
      patchesEl.innerHTML = "";
      if (!patches?.length) return;
      const h = document.createElement("h3");
      h.textContent = "待接受补丁";
      patchesEl.appendChild(h);
      for (const p of patches) {
        const box = document.createElement("div");
        box.className = "patch";
        const pre = document.createElement("pre");
        pre.className = "diff";
        pre.textContent = p.diff;
        box.innerHTML = `<div class="patch-head">${p.path}</div>`;
        box.appendChild(pre);
        const row = document.createElement("div");
        row.className = "row";
        const ok = document.createElement("button");
        ok.textContent = "接受";
        ok.onclick = async () => {
          await fetch(`/api/runs/${runId}/patches/${p.id}/accept`, { method: "POST" });
          box.remove();
        };
        const no = document.createElement("button");
        no.className = "ghost";
        no.textContent = "拒绝";
        no.onclick = async () => {
          await fetch(`/api/runs/${runId}/patches/${p.id}/reject`, { method: "POST" });
          box.remove();
        };
        row.append(ok, no);
        box.appendChild(row);
        patchesEl.appendChild(box);
      }
    }

    async function send() {
      const message = $("q").value.trim();
      if (!message) return;
      $("q").value = "";
      add("user", message);
      $("log").textContent = "跑工具中…";
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          message,
          reviewWrites: $("review").checked,
          allowDangerousShell: $("danger").checked,
          useMcp: $("useMcp").checked,
        }),
      });
      const j = await r.json();
      if (j.error) {
        $("log").className = "bad";
        $("log").textContent = j.error;
        return;
      }
      runId = j.runId;
      checkpointAt = "after";
      $("restore").disabled = !runId;
      $("restore").textContent = "Checkpoint";
      add("assistant", j.text, j.steps);
      renderPatches(j.patches);
      refreshSession();
      refreshCanvas();
      $("log").textContent = "";
    }

    $("go").onclick = send;
    $("q").onkeydown = (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
    };
    $("restore").onclick = async () => {
      if (!runId) return;
      const back = checkpointAt !== "before";
      if (back && !confirm("回到这一轮改文件之前？")) return;
      const r = await fetch(`/api/runs/${runId}/${back ? "restore" : "reapply"}`, { method: "POST" });
      const j = await r.json();
      checkpointAt = j.at || (back ? "before" : "after");
      $("restore").textContent = checkpointAt === "before" ? "Checkpoint · 改前" : "Checkpoint";
      $("log").className = "ok";
      $("log").textContent = checkpointAt === "before"
        ? `Checkpoint：已回到改前（${j.restored} 个文件）`
        : `Checkpoint：已回到改后（${j.restored} 个文件）`;
      patchesEl.innerHTML = "";
    };

    async function refreshCanvas() {
      const { canvas } = await (await fetch("/api/canvas")).json();
      const box = $("canvas");
      box.innerHTML = "";
      if (!canvas) {
        box.hidden = true;
        return;
      }
      box.hidden = false;
      const title = document.createElement("h2");
      title.textContent = canvas.title;
      box.appendChild(title);
      for (const block of canvas.blocks || []) renderBlock(box, block);
      if (canvas.lastAction) {
        const note = document.createElement("p");
        note.id = "canvas-action";
        note.textContent = `已记录：${canvas.lastAction}`;
        box.appendChild(note);
      }
    }

    function renderBlock(box, block) {
      if (block.type === "h1" || block.type === "h2" || block.type === "h3") {
        const el = document.createElement(block.type);
        el.textContent = block.text || "";
        box.appendChild(el);
        return;
      }
      if (block.type === "text") {
        const el = document.createElement("p");
        el.textContent = block.text || "";
        box.appendChild(el);
        return;
      }
      if (block.type === "stat") {
        const el = document.createElement("p");
        el.className = "canvas-stat";
        el.textContent = `${block.label} ${block.value}`;
        box.appendChild(el);
        return;
      }
      if (block.type === "callout") {
        const el = document.createElement("p");
        el.className = "canvas-callout " + (block.tone || "info");
        el.textContent = [block.title, block.text].filter(Boolean).join(" ");
        box.appendChild(el);
        return;
      }
      if (block.type === "table") {
        const table = document.createElement("table");
        const head = document.createElement("tr");
        for (const cell of block.headers || []) {
          const th = document.createElement("th");
          th.textContent = cell;
          head.appendChild(th);
        }
        table.appendChild(head);
        (block.rows || []).forEach((row, i) => {
          const tr = document.createElement("tr");
          row.forEach((cell, col) => {
            const td = document.createElement("td");
            td.textContent = col === 0 && block.rowTone?.[i] ? `${block.rowTone[i]} ${cell}` : cell;
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        box.appendChild(table);
        return;
      }
      if (block.type === "timeline" || block.type === "todos") {
        const list = document.createElement("ul");
        for (const item of block.items || []) {
          const li = document.createElement("li");
          li.textContent = [item.time, item.status, item.title || item.content, item.detail].filter(Boolean).join(" ");
          list.appendChild(li);
        }
        box.appendChild(list);
        return;
      }
      if (block.type === "bars") {
        const wrap = document.createElement("div");
        const cap = document.createElement("p");
        cap.textContent = [block.title, block.unit].filter(Boolean).join(" · ");
        wrap.appendChild(cap);
        const max = Math.max(1, ...(block.points || []).map((p) => Number(p.value) || 0));
        for (const point of block.points || []) {
          const row = document.createElement("div");
          row.className = "canvas-bar";
          const label = document.createElement("span");
          label.textContent = `${point.label} ${point.value}`;
          const meter = document.createElement("i");
          meter.style.width = `${Math.round(((Number(point.value) || 0) / max) * 100)}%`;
          row.append(label, meter);
          wrap.appendChild(row);
        }
        box.appendChild(wrap);
        return;
      }
      if (block.type === "pills") {
        const row = document.createElement("p");
        row.textContent = (block.items || []).map((item) => item.text).filter(Boolean).join(" · ");
        box.appendChild(row);
        return;
      }
      if (block.type === "diff") {
        const pre = document.createElement("pre");
        pre.className = "diff";
        const mark = { add: "+", del: "-" };
        pre.textContent = [block.path, ...(block.lines || []).map((line) => `${mark[line.kind] || " "} ${line.text}`)].filter(Boolean).join("\n");
        box.appendChild(pre);
        return;
      }
      if (block.type === "button") {
        const button = document.createElement("button");
        button.className = "ghost";
        button.textContent = block.label || block.action || "操作";
        button.onclick = async () => {
          await fetch("/api/canvas/action", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ action: block.action || block.label }),
          });
          refreshCanvas();
        };
        box.appendChild(button);
      }
    }

    refreshSession();
    refreshCanvas();
  </script>
</body>
</html>
