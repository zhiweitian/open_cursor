<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>编辑器</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    #path { flex: 1; font-family: monospace; font-size: 12px; color: var(--mute); }
    #wrap { display: flex; height: calc(100vh - 90px); }
    #outline { width: 200px; overflow: auto; border-right: 1px solid var(--line); font-size: 12px; }
    #outline button { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 4px 8px; cursor: pointer; font: inherit; }
    #editor { flex: 1; height: 100%; }
  </style>
</head>
<body>
  <header>
    <b>mini-cursor</b>
    <nav><a href="/">聊天</a><a href="/editor">编辑器</a><a href="/config">模型配置</a></nav>
  </header>
  <div id="bar">
    <span id="path"></span>
    <button id="save">保存</button>
    <label style="font-size:12px;color:var(--mute)"><input id="review" type="checkbox" checked /> 走 diff 审核</label>
    <span id="log"></span>
  </div>
  <div id="wrap">
    <aside id="outline"></aside>
    <div id="editor"></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const rel = params.get("path") || "plan.md";
    $("path").textContent = rel;
    let editor;
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js";
    s.onload = () => {
      require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs" } });
      require(["vs/editor/editor.main"], async () => {
        const r = await fetch("/api/file?path=" + encodeURIComponent(rel));
        const j = await r.json();
        const lang = rel.endsWith(".ts") ? "typescript" : rel.endsWith(".json") ? "json" : rel.endsWith(".md") ? "markdown" : "plaintext";
        editor = monaco.editor.create($("editor"), {
          value: j.content || "",
          language: lang,
          theme: "vs-dark",
          automaticLayout: true,
          fontSize: 13,
          inlineSuggest: { enabled: true },
        });
        const sym = await fetch("/api/symbols?path=" + encodeURIComponent(rel));
        const symbols = (await sym.json()).symbols || [];
        $("outline").innerHTML = symbols.map((s) =>
          `<button type="button" data-line="${s.line}">${s.kind} ${s.name}</button>`
        ).join("") || `<div style="padding:8px;color:var(--mute)">无符号</div>`;
        $("outline").onclick = (ev) => {
          const btn = ev.target.closest("button");
          if (!btn || !editor) return;
          const line = Number(btn.dataset.line);
          editor.setPosition({ lineNumber: line, column: 1 });
          editor.revealLineInCenter(line);
          editor.focus();
        };
        monaco.languages.registerInlineCompletionsProvider(lang, {
          provideInlineCompletions: async (model, position) => {
            const text = model.getValue();
            const cursor = model.getOffsetAt(position);
            const r = await fetch("/api/complete", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ text, cursor }),
            });
            const out = await r.json();
            if (!out.completion) return { items: [] };
            const range = new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column);
            return { items: [{ insertText: out.completion, range }] };
          },
          freeInlineCompletions() {},
        });
      });
    };
    document.head.appendChild(s);
    $("save").onclick = async () => {
      const r = await fetch("/api/file", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          path: rel,
          content: editor.getValue(),
          reviewWrites: $("review").checked,
        }),
      });
      const j = await r.json();
      $("log").textContent = j.patchId ? `待审核 ${j.patchId}，回聊天页接受` : j.ok ? "已保存" : (j.error || "失败");
    };
  </script>
</body>
</html>
